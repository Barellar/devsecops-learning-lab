name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

# Top-level global permission block set to absolute zero
permissions: {}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@eef6142ffa2459e45d68f1421740ecae869322eb # pinned to v4.2.1

      - name: Set up Python
        uses: actions/setup-python@f67e240f2d9c339b91411a56133965ba5c274c81 # pinned to v5.3.0
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v

  container-security:
    name: Container Build & Vulnerability Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@eef6142ffa2459e45d68f1421740ecae869322eb # pinned to v4.2.1

      # 1. Build the local image asset
      - name: Build local Docker image
        run: |
          docker build -t local-app-test:${{ github.sha }} .

      # 2. Generate SBOM Report (Requirement 1)
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@18f289c8728a055050473a21648a73562635607b # pinned to v0.28.0
        with:
          image-ref: 'local-app-test:${{ github.sha }}'
          format: 'cyclonedx'
          output: 'sbom.json'

      # 3. Retain SBOM as downloadable file
      - name: Upload SBOM Artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea2ffd40d1f5c4db881ee42a1 # pinned to v4.4.3
        with:
          name: app-sbom-report
          path: sbom.json
          retention-days: 14

      # 4. Enforce Severity Gates (Requirement 2)
      # Blocks the pipeline if any HIGH or CRITICAL issues are discovered
      - name: Run Trivy Severity Gate
        uses: aquasecurity/trivy-action@18f289c8728a055050473a21648a73562635607b # pinned to v0.28.0
        with:
          image-ref: 'local-app-test:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # Forces step failure when target vulnerabilities match
