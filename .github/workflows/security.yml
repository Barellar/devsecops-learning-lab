name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

# Top-level global permission block set to absolute zero
permissions: {}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v

  container-security:
    name: Container Build & Vulnerability Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Build the local image asset
      - name: Build local Docker image
        run: |
          docker build -t local-app-test:${{ github.sha }} .

      # 2. Generate SBOM Report
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-app-test:${{ github.sha }}'
          format: 'cyclonedx'
          output: 'sbom.json'

      # 3. Retain SBOM as downloadable file
      - name: Upload SBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-sbom-report
          path: sbom.json
          retention-days: 14

      # 4. Enforce Severity Gates
      - name: Run Trivy Severity Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-app-test:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
